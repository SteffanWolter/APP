<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Janas Studien-Navigator 2026</title>
  <style>
    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#faf9f6;color:#1d1d1f}body{display:grid;place-items:center}.loader{text-align:center;padding:2rem}.orb{width:48px;height:48px;margin:auto;border-radius:16px;background:linear-gradient(145deg,#fff,#ece9e3);box-shadow:0 18px 50px rgba(20,20,30,.13);display:grid;place-items:center;font-size:24px;animation:pulse 1.2s ease-in-out infinite alternate}p{color:#6e6e73}@keyframes pulse{to{transform:scale(1.06)}}
  </style>
</head>
<body>
  <main class="loader"><div class="orb">✦</div><h1>Studien-Navigator wird geladen</h1><p>Apple-Look nach dem Stil von Learn Studio.</p></main>
  <script>
    (async()=>{
      try{
        const names=['part00','part01','part02','part03'];
        const parts=await Promise.all(names.map(n=>fetch('./payload/'+n).then(r=>{if(!r.ok)throw new Error(n);return r.text()})));
        const raw=atob(parts.join('').replace(/\s/g,''));
        const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        const html=await new Response(stream).text();
        document.open();document.write(html);document.close();
      }catch(error){
        document.body.innerHTML='<main class="loader"><h1>Die Seite konnte nicht geladen werden.</h1><p>Bitte öffne sie über GitHub Pages oder lade das Repository neu.</p></main>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>

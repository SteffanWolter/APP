<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>Janas Studien-Navigator 2026</title>
  <style>
    :root{color-scheme:light dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;background:radial-gradient(circle at 90% 0,rgba(60,130,255,.14),transparent 25rem),#f5f5f7;color:#1d1d1f}.loader{width:min(420px,calc(100% - 32px));padding:30px;border:1px solid rgba(0,0,0,.08);border-radius:28px;background:rgba(255,255,255,.82);box-shadow:0 20px 60px rgba(0,0,0,.08);backdrop-filter:blur(20px);text-align:center}.orb{width:52px;height:52px;margin:0 auto 18px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,#2f91f3,#005ec4);color:#fff;box-shadow:inset 0 1px rgba(255,255,255,.35),0 12px 28px rgba(0,102,204,.22);font-size:22px;animation:pulse 1.15s ease-in-out infinite alternate}.loader h1{margin:0;font-size:1.25rem;letter-spacing:-.025em}.loader p{margin:8px 0 0;color:#6e6e73;font-size:.88rem;line-height:1.45}@keyframes pulse{to{transform:scale(1.055)}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}@media(prefers-color-scheme:dark){body{background:#0b0b0d;color:#f5f5f7}.loader{border-color:rgba(255,255,255,.1);background:rgba(28,28,30,.88)}.loader p{color:#a1a1a6}}
  </style>
</head>
<body>
  <main class="loader"><div class="orb">J</div><h1>Studien-Navigator wird vorbereitet</h1><p>Die mobile, responsive Ansicht wird geladen.</p></main>
  <script>
    (async()=>{
      try{
        const names=['part00','part01','part02','part03'];
        const parts=await Promise.all(names.map(n=>fetch('./payload/'+n,{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error(n);return r.text()})));
        const raw=atob(parts.join('').replace(/\s/g,''));
        const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
        if(!('DecompressionStream' in window))throw new Error('DecompressionStream unsupported');
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        let html=await new Response(stream).text();
        html=html.replace('</head>','<link rel="stylesheet" href="./fix.css?v=e6787902"><link rel="stylesheet" href="./hotfix.css?v=e0e00481"></head>');
        html=html.replace('<span style="color:var(--brand)">KI-robusten</span>','<span class="highlight">KI-robusten</span>');
        html=html.replace('<p style="color:var(--muted);margin-top:-6px">Ändert sich sofort mit den Reglern.</p>','<p class="muted-intro">Ändert sich sofort mit den Reglern.</p>');
        html=html.replace('<div style="margin-top:18px;padding:14px;border-radius:14px;background:var(--surface-2)">','<div class="reality-card">');
        html=html.replace('<div style="color:var(--muted);font-size:.82rem">${escapeHtml(p.badge)}</div>','<div class="personal-sub">${escapeHtml(p.badge)}</div>');
        const mobileNav='<nav class="mobile-nav" aria-label="Mobile Navigation"><a href="#ranking"><span class="nav-icon">◎</span><span>Rangliste</span></a><a href="#quiz"><span class="nav-icon">◇</span><span>Test</span></a><a href="#vergleich"><span class="nav-icon">⇄</span><span>Vergleich</span></a><a href="#quellen"><span class="nav-icon">≡</span><span>Quellen</span></a></nav>';
        html=html.replace('<div id="actionBar" class="action-bar"',mobileNav+'<div id="actionBar" class="action-bar"');
        document.open();document.write(html);document.close();
      }catch(error){
        document.body.innerHTML='<main class="loader"><div class="orb">!</div><h1>Die Seite konnte nicht geladen werden.</h1><p>Bitte aktualisiere die Seite. Falls der Fehler bleibt, öffne das Repository erneut.</p></main>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
